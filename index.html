<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonGPT - Chatbot</title>
    <style>
        :root { --bg-color: #121212; --chat-bg: #1e1e1e; --text-color: #e0e0e0; --melon-green: #4caf50; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background: var(--chat-bg); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; }
        .chat-header { background: linear-gradient(135deg, var(--melon-green), #2e7d32); padding: 15px; text-align: center; font-size: 1.5rem; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .header-title { margin-left: auto; margin-right: auto; }
        .settings-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; }
        .user-message { background-color: var(--melon-green); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-message { background-color: #333; color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 0; }
        .chat-input-area { display: flex; padding: 15px; background: #252525; border-top: 1px solid #333; }
        #user-input { flex: 1; background: #121212; border: 1px solid #444; padding: 12px; color: white; border-radius: 6px; outline: none; font-size: 1rem; }
        #send-btn { background: var(--melon-green); color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="header-title">🍉 MelonGPT</span>
        <button class="settings-btn" id="settings-btn" title="Setup API Key">⚙️</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">Welcome to MelonGPT! Click the ⚙️ gear icon to enter your token. We are now running completely inside GitHub server layers!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    // Point directly to your clean, unblockable repository links
    const REPO_OWNER = "ShadesVRwasTaken"; 
    const REPO_NAME = "MelonGPT"; 

    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const settingsBtn = document.getElementById('settings-btn');

    let apiKey = localStorage.getItem('melongpt_key') || "";

    settingsBtn.addEventListener('click', () => {
        const inputKey = prompt("Enter your GitHub Fine-Grained Token:", apiKey);
        if (inputKey !== null) {
            apiKey = inputKey.trim();
            localStorage.setItem('melongpt_key', apiKey);
            alert("Token saved safely in your browser memory!");
        }
    });

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSendMessage() {
        if (!apiKey) { return alert("Please tap the ⚙️ gear icon to input your GitHub token first!"); }
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message';
        loadingDiv.innerText = '🍉 MelonGPT background worker starting... (takes ~15s)';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Wake up your GitHub server script completely past your Chromebook blocks
            await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({ event_type: "user-message", client_payload: { message: text } })
            });

            // Continuously check for the reply file generated by GitHub Action
            let checkInterval = setInterval(async () => {
                try {
                    const res = await fetch(`https://githubusercontent.com{REPO_OWNER}/${REPO_NAME}/main/reply.json?t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.user === text) {
                            clearInterval(checkInterval);
                            loadingDiv.remove();
                            appendMessage(data.bot, 'bot-message');
                        }
                    }
                } catch (e) {}
            }, 3000);

        } catch (error) {
            loadingDiv.innerText = "Error checking script. Verify your repository ownership tags.";
        }
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
</script>

</body>
</html>
