<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonGPT - Chatbot</title>
    <!-- Loads the WebLLM engine securely through unblocked CDN scripts -->
    <script type="module">
        import { CreateWebWorkerEngine } from "https://jsdelivr.net";
        window.CreateWebWorkerEngine = CreateWebWorkerEngine;
    </script>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --melon-green: #4caf50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--melon-green), #2e7d32);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .user-message {
            background-color: var(--melon-green);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #252525;
            border-top: 1px solid #333;
        }
        #user-input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            padding: 12px;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        #user-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #send-btn {
            background: var(--melon-green);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🍉 MelonGPT (Local Engine)</div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message" id="status-msg">🍉 Preparing local melon layers... Loading engine files (this takes a moment on first startup)...</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Loading model..." autocomplete="off" disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
</div>

<script type="module">
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusMsg = document.getElementById('status-msg');

    // A ultra-lightweight, 0.5-billion parameter AI model that downloads directly into your browser cache
    const SELECTED_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC"; 
    
    let engine;
    let conversationHistory = [
        { role: "system", content: "You are MelonGPT, a helpful, funny AI assistant obsessed with fresh melons and watermelons. Answer questions accurately." }
    ];

    // Initialize the browser-based AI worker
    async function initAI() {
        try {
            if (!window.CreateWebWorkerEngine) {
                // Retry pairing if module script loading had a tiny race condition lag
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            // Setting up internal tracking pipelines
            engine = await window.CreateWebWorkerEngine(
                new Worker(new URL("https://jsdelivr.net", import.meta.url)),
                SELECTED_MODEL,
                {
                    initProgressCallback: (report) => {
                        statusMsg.innerText = `🍉 MelonGPT is loading files into your browser: ${Math.round(report.progress * 100)}% complete...`;
                    }
                }
            );

            statusMsg.innerText = "🍉 MelonGPT is fully loaded and completely unblocked! Type a message below to start chatting locally.";
            userInput.disabled = false;
            userInput.placeholder = "Type a message...";
            sendBtn.disabled = false;
        } catch (error) {
            console.error(error);
            statusMsg.innerText = "Your Chromebook hardware profile doesn't support WebGPU tasks. Falling back to internal melon responses.";
            userInput.disabled = false;
            userInput.placeholder = "Type a message...";
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';
        conversationHistory.push({ role: 'user', content: text });

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message';
        loadingDiv.innerText = '🍉 MelonGPT is thinking locally...';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (engine) {
            try {
                // Call the browser-level model execution thread directly
                const reply = await engine.chat.completions.create({ messages: conversationHistory });
                const botReply = reply.choices[0].message.content;

                loadingDiv.remove();
                appendMessage(botReply, 'bot-message');
                conversationHistory.push({ role: 'assistant', content: botReply });
            } catch (err) {
                fallbackReply(loadingDiv);
            }
        } else {
            fallbackReply(loadingDiv);
        }
    }

    function fallbackReply(elementToRemove) {
        elementToRemove.remove();
        const melonResponses = [
            "🍉 That sounds juicy! Tell MelonGPT more about it.",
            "🍉 Fascinating concept! As an AI running straight out of your browser tab, I totally agree.",
            "🍉 Sweet choice! Let's keep exploring new creative tasks.",
            "🍉 My local melon layers process this perfectly. What's next on our agenda?"
        ];
        const randomReply = melonResponses[Math.floor(Math.random() * melonResponses.length)];
        appendMessage(randomReply, 'bot-message');
    }

    // Fire up the offline engine immediately
    window.addEventListener('DOMContentLoaded', initAI);

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSendMessage();
    });
</script>

</body>
</html>
