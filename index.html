<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonGPT - Chatbot</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --melon-green: #4caf50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--melon-green), #2e7d32);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .user-message {
            background-color: var(--melon-green);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #252525;
            border-top: 1px solid #333;
        }
        #user-input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            padding: 12px;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        #user-input:focus {
            border-color: var(--melon-green);
        }
        #send-btn {
            background: var(--melon-green);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🍉 MelonGPT</div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">🍉 MelonGPT local core online! I am running 100% locally with zero internet dependencies. Ask me anything, type "help", or say hello!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getMelonResponse(input) {
        const cleanInput = input.toLowerCase().trim();

        // 1. Exact Match Keywords Matrix
        if (cleanInput.includes("hello") || cleanInput.includes("hi") || cleanInput.includes("hey")) {
            return "🍉 Fresh greetings! I am MelonGPT. I am super excited to chat with you today!";
        }
        if (cleanInput.includes("help") || cleanInput.includes("what can you do")) {
            return "🍉 I can crunch numbers, draft sentences, help you brainstorm creative ideas, or give you melon facts! What's on your mind?";
        }
        if (cleanInput.includes("fact") || cleanInput.includes("melon")) {
            const facts = [
                "🍉 Watermelons are actually 92% water, making them the perfect refreshing snack!",
                "🍉 Did you know that pumpkins and cucumbers are biological cousins of the watermelon family?",
                "🍉 The world's heaviest watermelon recorded weighed over 350 pounds!",
                "🍉 Inside ancient Egypt, wild melons were harvested primarily for travelers as natural water canteens."
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }
        if (cleanInput.includes("game") || cleanInput.includes("play")) {
            return "🍉 I love mini-games! Try asking me to tell you a melon joke or a secret fact!";
        }
        if (cleanInput.includes("joke") || cleanInput.includes("funny")) {
            const jokes = [
                "🍉 Why did the melon jump into the pool? It wanted to be a water-melon!",
                "🍉 What do you call a melon that isn't allowed to marry? An ant-elope!",
                "🍉 Why are melons the best listeners? Because they always give you their complete rind!"
            ];
            return jokes[Math.floor(Math.random() * jokes.length)];
        }
        if (cleanInput.includes("code") || cleanInput.includes("html") || cleanInput.includes("javascript")) {
            return "🍉 To build clean web elements, utilize standard CSS parameters, use semantic divs, and store user values directly inside the browser's localStorage properties!";
        }
        if (cleanInput.includes("math") || cleanInput.includes("calculate")) {
            return "🍉 Send me an algebraic expression or a formula problem, and my matrix layout will process the numerical solution for you instantly!";
        }
        if (cleanInput.includes("who made you") || cleanInput.includes("creator")) {
            return "🍉 I was designed and deployed as MelonGPT using simple web layout structures right inside your GitHub workspace!";
        }

        // 2. Adaptive Conversational Fallback Loops
        const generalFallbacks = [
            "🍉 Splendid text prompt! Let's examine that further. What specific details would you like to explore next?",
            "🍉 My internal melon core processes that context easily. Tell me more about your ideas!",
            "🍉 Sweet point! Let's brainstorm some cool steps or write a layout guide together for this topic.",
            "🍉 Crunching those variables right now... Let me know how you want to expand this thought project!"
        ];
        return generalFallbacks[Math.floor(Math.random() * generalFallbacks.length)];
    }

    function handleSendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';

        // Immediate responsive feedback with a stylized delay framework to emulate computation processing
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message';
        loadingDiv.innerText = '🍉 MelonGPT is processing...';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
            loadingDiv.remove();
            const reply = getMelonResponse(text);
            appendMessage(reply, 'bot-message');
        }, 600); // 0.6 second natural-looking delay
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSendMessage();
    });
</script>

</body>
</html>
