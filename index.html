<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonGPT - Chatbot</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --melon-green: #4caf50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            position: relative;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--melon-green), #2e7d32);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            margin-left: auto;
            margin-right: auto;
        }
        .settings-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .user-message {
            background-color: var(--melon-green);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #252525;
            border-top: 1px solid #333;
        }
        #user-input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            padding: 12px;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        #user-input:focus {
            border-color: var(--melon-green);
        }
        #send-btn {
            background: var(--melon-green);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="header-title">🍉 MelonGPT</span>
        <button class="settings-btn" id="settings-btn" title="Setup API Key">⚙️</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">Welcome to MelonGPT! Tap the ⚙️ gear icon in the header to save your GitHub PAT securely in your browser and start chatting.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    // Configured for GitHub Marketplace Models
    const GATEWAY_URL = "https://azure.com"; 
    const MODEL_ID = "meta-llama-3.1-70b-instruct"; 

    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const settingsBtn = document.getElementById('settings-btn');

    let conversationHistory = [
        { role: "system", content: "You are MelonGPT, a helpful and friendly AI assistant themed around fresh melons." }
    ];

    // Check browser cache for your token
    let apiKey = localStorage.getItem('melongpt_key') || "";

    settingsBtn.addEventListener('click', () => {
        const inputKey = prompt("Enter your GitHub PAT (ghp_...):", apiKey);
        if (inputKey !== null) {
            apiKey = inputKey.trim();
            localStorage.setItem('melongpt_key', apiKey);
            alert("Token saved safely in your browser memory!");
        }
    });

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSendMessage() {
        if (!apiKey) {
            alert("Please tap the ⚙️ gear icon to input your GitHub PAT first!");
            return;
        }

        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';
        conversationHistory.push({ role: 'user', content: text });

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message';
        loadingDiv.innerText = '🍉 MelonGPT is thinking...';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch(GATEWAY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                throw new Error(`API Error: ${response.statusText}`);
            }

            const data = await response.json();
            const botReply = data.choices[0].message.content;
            
            loadingDiv.remove();
            appendMessage(botReply, 'bot-message');
            conversationHistory.push({ role: 'assistant', content: botReply });

        } catch (error) {
            console.error(error);
            loadingDiv.innerText = "Error connecting to MelonGPT. Make sure your PAT was pasted correctly and has access to GitHub Models.";
        }
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSendMessage();
    });
</script>

</body>
</html>
