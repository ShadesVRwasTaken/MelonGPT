name: MelonGPT Engine
on:
  repository_dispatch:
    types: [user-message]

permissions:
  contents: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch MelonGPT Response
        id: ai
        run: |
          USER_MSG="${{ github.event.client_payload.message }}"
          
          # Call GitHub Models safely server-side
          RESPONSE=$(curl -s -X POST "https://azure.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.MELONGPT_TOKEN }}" \
            -d "{\"model\": \"meta-llama-3.1-70b-instruct\", \"messages\": [{\"role\": \"system\", \"content\": \"You are MelonGPT, a helpful AI themed around fresh melons.\"}, {\"role\": \"user\", \"content\": \"$USER_MSG\"}]}")
          
          # Extract response text smoothly
          BOT_REPLY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # Save it locally into a public history file
          echo "{\"user\": \"$USER_MSG\", \"bot\": \"$BOT_REPLY\", \"time\": \"$(date)\"}" > reply.json

      - name: Commit and Push Reply
        run: |
          git config --global user.name "MelonGPT-Bot"
          git config --global user.email "bot@melongpt.ai"
          git add reply.json
          git commit -m "MelonGPT: New response processed"
          git push origin main
